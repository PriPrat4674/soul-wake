# Builds the SoulWake APK on GitHub's servers. No Android Studio needed.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Pushing a version tag (e.g. v3.0.0) also publishes the APK on the Releases page.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired "tools" package, which newer SDK managers reject.
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: soulwake-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk soulwake.apk

      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: soulwake.apk
          generate_release_notes: true
